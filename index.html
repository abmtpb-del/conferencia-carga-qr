<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conferência de Carga</title>

    <style>
        :root {
            --vermelho: #b5121b;
            --vermelho-escuro: #7d0c12;
            --verde: #16803c;
            --cinza-claro: #f1f3f5;
            --cinza: #667085;
            --texto: #202124;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            color: var(--texto);
            background: var(--cinza-claro);
            font-family: Arial, Helvetica, sans-serif;
        }

        .aplicacao {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--vermelho-escuro);
            font-size: 1.7rem;
        }

        header p {
            margin: 0;
            color: var(--cinza);
        }

        .cartao {
            padding: 18px;
            margin-bottom: 18px;
            background: var(--branco);
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.09);
        }

        .visualizador {
            position: relative;
            width: 100%;
            min-height: 320px;
            overflow: hidden;
            background: #111111;
            border-radius: 12px;
        }

        video {
            display: block;
            width: 100%;
            min-height: 320px;
            object-fit: cover;
        }

        .guia {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 230px;
            height: 230px;
            border: 4px solid rgba(255, 255, 255, 0.9);
            border-radius: 18px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25);
            pointer-events: none;
        }

        .status {
            min-height: 24px;
            margin: 14px 0;
            color: var(--cinza);
            text-align: center;
        }

        .status.sucesso {
            color: var(--verde);
            font-weight: bold;
        }

        .status.erro {
            color: var(--vermelho);
            font-weight: bold;
        }

        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button,
        .link-botao {
            min-height: 48px;
            padding: 12px 16px;
            border: 0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .primario {
            color: var(--branco);
            background: var(--vermelho);
        }

        .primario:hover:not(:disabled) {
            background: var(--vermelho-escuro);
        }

        .secundario {
            color: var(--texto);
            background: #e4e7ec;
        }

        .resultado-titulo {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        #resultado {
            min-height: 60px;
            padding: 14px;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
            background: var(--cinza-claro);
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        .link-botao {
            display: block;
            margin-top: 10px;
            color: var(--branco);
            text-align: center;
            text-decoration: none;
            background: var(--verde);
        }

        [hidden] {
            display: none !important;
        }

        footer {
            color: var(--cinza);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .cartao {
                padding: 12px;
            }

            .guia {
                width: 200px;
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <main class="aplicacao">
        <header>
            <h1>Conferência de Carga</h1>
            <p>Leitura de materiais por QR Code</p>
        </header>

        <section class="cartao">
            <div class="visualizador">
                <video
                    id="video"
                    playsinline
                    muted
                ></video>

                <div class="guia" aria-hidden="true"></div>
            </div>

            <p id="status" class="status">
                Toque em “Abrir câmera” para iniciar.
            </p>

            <div class="botoes">
                <button
                    id="botao-iniciar"
                    class="primario"
                    type="button"
                >
                    Abrir câmera
                </button>

                <button
                    id="botao-parar"
                    class="secundario"
                    type="button"
                    disabled
                >
                    Parar câmera
                </button>
            </div>
        </section>

        <section class="cartao">
            <h2 class="resultado-titulo">Conteúdo identificado</h2>

            <div id="resultado">
                Nenhum QR Code identificado.
            </div>

            <button
                id="botao-copiar"
                class="secundario"
                type="button"
                disabled
            >
                Copiar conteúdo
            </button>

            <a
                id="botao-abrir"
                class="link-botao"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
            >
                Abrir endereço
            </a>
        </section>

        <footer>
            Projeto inicial de conferência por QR Code
        </footer>
    </main>

    <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

    <script>
        const video = document.getElementById("video");
        const statusElemento = document.getElementById("status");
        const resultadoElemento = document.getElementById("resultado");

        const botaoIniciar = document.getElementById("botao-iniciar");
        const botaoParar = document.getElementById("botao-parar");
        const botaoCopiar = document.getElementById("botao-copiar");
        const botaoAbrir = document.getElementById("botao-abrir");

        const leitor = new ZXingBrowser.BrowserQRCodeReader();

        let controlesCamera = null;
        let ultimoResultado = "";
        let horarioUltimaLeitura = 0;

        function alterarStatus(mensagem, tipo = "") {
            statusElemento.textContent = mensagem;
            statusElemento.className = `status ${tipo}`.trim();
        }

        function identificarEndereco(texto) {
            try {
                const endereco = new URL(texto);

                if (
                    endereco.protocol === "http:" ||
                    endereco.protocol === "https:"
                ) {
                    return endereco.href;
                }
            } catch {
                return null;
            }

            return null;
        }

        function apresentarResultado(texto) {
            const agora = Date.now();

            if (
                texto === ultimoResultado &&
                agora - horarioUltimaLeitura < 2000
            ) {
                return;
            }

            ultimoResultado = texto;
            horarioUltimaLeitura = agora;

            resultadoElemento.textContent = texto;
            botaoCopiar.disabled = false;

            alterarStatus("QR Code identificado com sucesso.", "sucesso");

            if ("vibrate" in navigator) {
                navigator.vibrate(150);
            }

            const endereco = identificarEndereco(texto);

            if (endereco) {
                botaoAbrir.href = endereco;
                botaoAbrir.hidden = false;
            } else {
                botaoAbrir.href = "#";
                botaoAbrir.hidden = true;
            }
        }

        function mensagemErroCamera(erro) {
            if (erro?.name === "NotAllowedError") {
                return "A permissão da câmera foi negada.";
            }

            if (erro?.name === "NotFoundError") {
                return "Nenhuma câmera foi encontrada.";
            }

            if (erro?.name === "NotReadableError") {
                return "A câmera está sendo utilizada por outro aplicativo.";
            }

            return `Não foi possível abrir a câmera: ${
                erro?.message || erro
            }`;
        }

        async function iniciarCamera() {
            if (!window.isSecureContext) {
                alterarStatus(
                    "A câmera exige uma conexão HTTPS.",
                    "erro"
                );
                return;
            }

            if (controlesCamera) {
                return;
            }

            botaoIniciar.disabled = true;
            alterarStatus("Solicitando acesso à câmera...");

            try {
                const restricoes = {
                    audio: false,
                    video: {
                        facingMode: {
                            ideal: "environment"
                        },
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        }
                    }
                };

                controlesCamera = await leitor.decodeFromConstraints(
                    restricoes,
                    video,
                    (resultado) => {
                        if (resultado) {
                            apresentarResultado(resultado.getText());
                        }
                    }
                );

                botaoParar.disabled = false;
                alterarStatus(
                    "Câmera aberta. Aponte para um QR Code."
                );
            } catch (erro) {
                controlesCamera = null;
                botaoIniciar.disabled = false;
                botaoParar.disabled = true;

                alterarStatus(
                    mensagemErroCamera(erro),
                    "erro"
                );
            }
        }

        function pararCamera() {
            if (controlesCamera) {
                controlesCamera.stop();
                controlesCamera = null;
            }

            botaoIniciar.disabled = false;
            botaoParar.disabled = true;

            alterarStatus("Câmera encerrada.");
        }

        async function copiarResultado() {
            const texto = resultadoElemento.textContent;

            try {
                await navigator.clipboard.writeText(texto);
                alterarStatus("Conteúdo copiado.", "sucesso");
            } catch {
                alterarStatus(
                    "Não foi possível copiar o conteúdo.",
                    "erro"
                );
            }
        }

        botaoIniciar.addEventListener("click", iniciarCamera);
        botaoParar.addEventListener("click", pararCamera);
        botaoCopiar.addEventListener("click", copiarResultado);

        window.addEventListener("pagehide", () => {
            if (controlesCamera) {
                controlesCamera.stop();
            }
        });
    </script>
</body>
</html>

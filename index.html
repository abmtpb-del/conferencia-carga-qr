<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conferência de Carga</title>

    <style>
        :root {
            --vermelho: #b5121b;
            --vermelho-escuro: #7d0c12;
            --verde: #16803c;
            --cinza-claro: #f1f3f5;
            --cinza: #667085;
            --texto: #202124;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 16px;
            color: var(--texto);
            background: var(--cinza-claro);
            font-family: Arial, Helvetica, sans-serif;
        }

        .aplicacao {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 18px;
            text-align: center;
        }

        h1 {
            margin: 0 0 6px;
            color: var(--vermelho-escuro);
            font-size: 1.7rem;
        }

        header p {
            margin: 0;
            color: var(--cinza);
        }

        .cartao {
            padding: 16px;
            margin-bottom: 16px;
            background: var(--branco);
            border-radius: 16px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.09);
        }

        .visualizador {
            position: relative;
            width: 100%;
            min-height: 320px;
            overflow: hidden;
            background: #111111;
            border-radius: 12px;
        }

        video {
            display: block;
            width: 100%;
            min-height: 320px;
            object-fit: cover;
        }

        .guia {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 230px;
            height: 230px;
            border: 4px solid rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.24);
            pointer-events: none;
        }

        .guia::before,
        .guia::after {
            position: absolute;
            content: "";
            width: 38px;
            height: 38px;
            border-color: #38ef7d;
            border-style: solid;
        }

        .guia::before {
            top: -5px;
            left: -5px;
            border-width: 6px 0 0 6px;
            border-radius: 14px 0 0;
        }

        .guia::after {
            right: -5px;
            bottom: -5px;
            border-width: 0 6px 6px 0;
            border-radius: 0 0 14px;
        }

        .status {
            min-height: 24px;
            margin: 14px 0;
            color: var(--cinza);
            text-align: center;
        }

        .status.sucesso {
            color: var(--verde);
            font-weight: bold;
        }

        .status.erro {
            color: var(--vermelho);
            font-weight: bold;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        button,
        .link-botao {
            min-height: 48px;
            padding: 12px 14px;
            border: 0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .primario {
            color: var(--branco);
            background: var(--vermelho);
        }

        .secundario {
            color: var(--texto);
            background: #e4e7ec;
        }

        #botao-lanterna {
            grid-column: 1 / -1;
        }

        .resultado-titulo {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        #resultado {
            min-height: 60px;
            padding: 14px;
            margin-bottom: 14px;
            overflow-wrap: anywhere;
            background: var(--cinza-claro);
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        .link-botao {
            display: block;
            margin-top: 10px;
            color: var(--branco);
            text-align: center;
            text-decoration: none;
            background: var(--verde);
        }

        [hidden] {
            display: none !important;
        }

        footer {
            color: var(--cinza);
            font-size: 0.85rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .cartao {
                padding: 12px;
            }

            .guia {
                width: 210px;
                height: 210px;
            }
        }
    </style>
</head>

<body>
    <main class="aplicacao">
        <header>
            <h1>Conferência de Carga</h1>
            <p>Leitura otimizada de QR Code</p>
        </header>

        <section class="cartao">
            <div class="visualizador">
                <video
                    id="video"
                    playsinline
                    muted
                ></video>

                <div class="guia" aria-hidden="true"></div>
            </div>

            <p
                id="status"
                class="status"
                aria-live="polite"
            >
                Toque em “Abrir câmera” para iniciar.
            </p>

            <div class="botoes">
                <button
                    id="botao-iniciar"
                    class="primario"
                    type="button"
                >
                    Abrir câmera
                </button>

                <button
                    id="botao-parar"
                    class="secundario"
                    type="button"
                    disabled
                >
                    Parar câmera
                </button>

                <button
                    id="botao-lanterna"
                    class="secundario"
                    type="button"
                    hidden
                >
                    Ligar lanterna
                </button>
            </div>
        </section>

        <section class="cartao">
            <h2 class="resultado-titulo">Conteúdo identificado</h2>

            <div id="resultado">
                Nenhum QR Code identificado.
            </div>

            <button
                id="botao-copiar"
                class="secundario"
                type="button"
                disabled
            >
                Copiar conteúdo
            </button>

            <a
                id="botao-abrir"
                class="link-botao"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
            >
                Abrir endereço
            </a>
        </section>

        <footer>
            Projeto de conferência por QR Code
        </footer>
    </main>

    <script type="module">
        import QrScanner from
            "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";

        const video = document.getElementById("video");
        const statusElemento = document.getElementById("status");
        const resultadoElemento = document.getElementById("resultado");

        const botaoIniciar =
            document.getElementById("botao-iniciar");

        const botaoParar =
            document.getElementById("botao-parar");

        const botaoLanterna =
            document.getElementById("botao-lanterna");

        const botaoCopiar =
            document.getElementById("botao-copiar");

        const botaoAbrir =
            document.getElementById("botao-abrir");

        let ultimoResultado = "";
        let horarioUltimaLeitura = 0;
        let cameraAtiva = false;

        function alterarStatus(mensagem, tipo = "") {
            statusElemento.textContent = mensagem;
            statusElemento.className =
                `status ${tipo}`.trim();
        }

        function calcularRegiao(videoElemento) {
            const largura = videoElemento.videoWidth;
            const altura = videoElemento.videoHeight;

            const tamanho = Math.round(
                Math.min(largura, altura) * 0.65
            );

            return {
                x: Math.round((largura - tamanho) / 2),
                y: Math.round((altura - tamanho) / 2),
                width: tamanho,
                height: tamanho,

                // Somente 400 × 400 pixels são processados.
                downScaledWidth: 400,
                downScaledHeight: 400
            };
        }

        const leitor = new QrScanner(
            video,

            (resultado) => {
                apresentarResultado(resultado.data);
            },

            {
                preferredCamera: "environment",

                // Até 25 verificações por segundo.
                maxScansPerSecond: 25,

                // Analisa somente a região central.
                calculateScanRegion: calcularRegiao,

                returnDetailedScanResult: true,

                highlightScanRegion: false,
                highlightCodeOutline: false,

                onDecodeError: () => {
                    // Ausência momentânea de QR Code não é erro.
                }
            }
        );

        // Otimização para QR Code escuro em fundo claro.
        leitor.setInversionMode("original");

        function identificarEndereco(texto) {
            try {
                const endereco = new URL(texto);

                if (
                    endereco.protocol === "http:" ||
                    endereco.protocol === "https:"
                ) {
                    return endereco.href;
                }
            } catch {
                return null;
            }

            return null;
        }

        function apresentarResultado(texto) {
            const agora = Date.now();

            if (
                texto === ultimoResultado &&
                agora - horarioUltimaLeitura < 1500
            ) {
                return;
            }

            ultimoResultado = texto;
            horarioUltimaLeitura = agora;

            resultadoElemento.textContent = texto;
            botaoCopiar.disabled = false;

            alterarStatus(
                "QR Code identificado com sucesso.",
                "sucesso"
            );

            if ("vibrate" in navigator) {
                navigator.vibrate(120);
            }

            const endereco = identificarEndereco(texto);

            if (endereco) {
                botaoAbrir.href = endereco;
                botaoAbrir.hidden = false;
            } else {
                botaoAbrir.href = "#";
                botaoAbrir.hidden = true;
            }
        }

        async function configurarFocoContinuo() {
            try {
                const faixa =
                    video.srcObject?.getVideoTracks()[0];

                if (!faixa?.getCapabilities) {
                    return;
                }

                const capacidades = faixa.getCapabilities();

                if (
                    capacidades.focusMode?.includes("continuous")
                ) {
                    await faixa.applyConstraints({
                        advanced: [
                            {
                                focusMode: "continuous"
                            }
                        ]
                    });
                }
            } catch {
                // O aparelho pode não disponibilizar foco manual.
            }
        }

        async function verificarLanterna() {
            try {
                const possuiLanterna =
                    await leitor.hasFlash();

                botaoLanterna.hidden = !possuiLanterna;
            } catch {
                botaoLanterna.hidden = true;
            }
        }

        function mensagemErroCamera(erro) {
            const nome = erro?.name || "";

            if (nome === "NotAllowedError") {
                return "A permissão da câmera foi negada.";
            }

            if (nome === "NotFoundError") {
                return "Nenhuma câmera foi encontrada.";
            }

            if (nome === "NotReadableError") {
                return "A câmera está sendo utilizada por outro aplicativo.";
            }

            return `Não foi possível abrir a câmera: ${
                erro?.message || erro
            }`;
        }

        async function iniciarCamera() {
            if (!window.isSecureContext) {
                alterarStatus(
                    "A câmera exige uma conexão HTTPS.",
                    "erro"
                );
                return;
            }

            if (cameraAtiva) {
                return;
            }

            botaoIniciar.disabled = true;
            alterarStatus("Solicitando acesso à câmera...");

            try {
                const possuiCamera =
                    await QrScanner.hasCamera();

                if (!possuiCamera) {
                    throw new Error(
                        "Nenhuma câmera disponível."
                    );
                }

                await leitor.start();

                cameraAtiva = true;
                botaoParar.disabled = false;

                await configurarFocoContinuo();
                await verificarLanterna();

                alterarStatus(
                    "Aponte o QR Code para o centro do quadro."
                );
            } catch (erro) {
                cameraAtiva = false;
                botaoIniciar.disabled = false;
                botaoParar.disabled = true;

                alterarStatus(
                    mensagemErroCamera(erro),
                    "erro"
                );
            }
        }

        function pararCamera() {
            leitor.stop();

            cameraAtiva = false;
            botaoIniciar.disabled = false;
            botaoParar.disabled = true;
            botaoLanterna.hidden = true;
            botaoLanterna.textContent = "Ligar lanterna";

            alterarStatus("Câmera encerrada.");
        }

        async function alternarLanterna() {
            try {
                await leitor.toggleFlash();

                botaoLanterna.textContent =
                    leitor.isFlashOn()
                        ? "Desligar lanterna"
                        : "Ligar lanterna";
            } catch {
                alterarStatus(
                    "A lanterna não está disponível.",
                    "erro"
                );
            }
        }

        async function copiarResultado() {
            try {
                await navigator.clipboard.writeText(
                    resultadoElemento.textContent
                );

                alterarStatus(
                    "Conteúdo copiado.",
                    "sucesso"
                );
            } catch {
                alterarStatus(
                    "Não foi possível copiar o conteúdo.",
                    "erro"
                );
            }
        }

        botaoIniciar.addEventListener(
            "click",
            iniciarCamera
        );

        botaoParar.addEventListener(
            "click",
            pararCamera
        );

        botaoLanterna.addEventListener(
            "click",
            alternarLanterna
        );

        botaoCopiar.addEventListener(
            "click",
            copiarResultado
        );

        window.addEventListener("pagehide", () => {
            leitor.destroy();
        });
    </script>
</body>
</html>
